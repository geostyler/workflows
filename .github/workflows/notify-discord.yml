name: Discord Notification

on:
  workflow_call:
    inputs:
      message:
        description: Message to post to Discord, e.g. "My repo [v1.2.3](https://github.com/org/my-repo/releases/tag/v1.2.3) has been released."
        required: true
        type: string
    secrets:
      discord-webhook:
        description: Discord webhook URL to send the notification to.
        required: true

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification 📯
        env:
          DISCORD_WEBHOOK: ${{ secrets.discord-webhook }}
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: ${{ inputs.message }}
